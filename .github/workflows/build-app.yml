name: build-app
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_on_win:
        description: Build the Windows job
        required: false
        default: false
        type: boolean
      build_on_linux:
        description: Build the Linux job
        required: false
        default: false
        type: boolean
      build_on_mac:
        description: Build the macOS job
        required: false
        default: true
        type: boolean
jobs:
  build_on_win:
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.build_on_win
    # Pinned to windows-2022 (Visual Studio 2022 / v17). `windows-latest` rolled
    # to the windows-2025-vs2026 image (Visual Studio 18), which the old
    # node-gyp 9.x that builds noobs's native addon can't detect ("unknown
    # version" -> "could not find a version of Visual Studio 2017 or newer"),
    # so npm silently drops the optional noobs subtree and copyNoobs fails the
    # build. VS2022 is the toolchain this build last succeeded on.
    runs-on: windows-2022
    env:
      CI: false
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ''
      CSC_KEY_PASSWORD: ''
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: setup python 3.11 for node-gyp
        # noobs's native addon is built from source by `node-gyp rebuild` during
        # `npm ci`. The node-gyp that runs it is the 9.x hoisted into the repo's
        # node_modules (resolved from node_modules/.bin), and node-gyp 9.x imports
        # Python's `distutils` — which the stdlib removed in 3.12. The runner
        # otherwise auto-discovers a 3.12+ Python, the configure step throws
        # `No module named 'distutils'`, and npm silently rolls back the
        # *optional* noobs subtree — shipping a recorder with no OBS binaries
        # (copyNoobs then fails the build).
        #
        # Python 3.11 still ships stdlib distutils, so we install it and force
        # node-gyp onto this exact interpreter via PYTHON / npm_config_python
        # below (PATH alone isn't enough — node-gyp picks its own interpreter).
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: clean npm cache
        run: npm cache clean -f
      - name: install dependencies
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
          npm_config_python: ${{ steps.setup-python.outputs.python-path }}
        # --foreground-scripts surfaces noobs's node-gyp output inline; without it
        # npm hides the build error and silently rolls back the optional subtree.
        run: npm ci --foreground-scripts
      - name: build for windows
        run: npm run build:app:windows
  build_on_mac:
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch' && inputs.build_on_mac
    runs-on: macos-latest
    env:
      CI: false
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Consumed by the signature-verification step below. Empty on fork PRs,
      # where that step is skipped anyway.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: inst
        run: pip install requests
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: update node_canvas deps
        run: brew install pkg-config cairo pango libpng jpeg giflib librsvg
      - name: install node-gyp
        run: npm i -g node-gyp@latest
      - name: clean npm cache
        run: npm cache clean -f
      - name: install dependencies
        run: npm ci
      - name: install dmg-license
        run: npm i dmg-license
      # GitHub withholds repository secrets from `pull_request` runs whose head is
      # a fork, so CSC_LINK/CSC_KEY_PASSWORD arrive as empty strings there and the
      # runner has no certificate to sign with. Handing electron-builder an empty
      # CSC_LINK does not degrade gracefully -- it still takes the signing path,
      # resolves "" as a path, and fails the job with "<workspace> not a file".
      # So probe for the credentials and pick a build mode instead of assuming
      # they are present. Testing the secrets directly rather than checking
      # whether the head is a fork also covers Dependabot PRs (separate secret
      # store) and a repo whose signing secrets were removed.
      - name: detect signing credentials
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${CSC_LINK:-}" ] && [ -n "${CSC_KEY_PASSWORD:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No code-signing credentials on this runner (expected for fork PRs) - building unsigned.'
          fi
      # CSC_FOR_PULL_REQUEST is what makes electron-builder sign at all on a
      # `pull_request` event; without it PR builds come out unsigned and the
      # verification step below would fail.
      - name: build for mac (signed)
        if: steps.signing.outputs.available == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_FOR_PULL_REQUEST: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: npm run build:app:mac
      # Compile-only check: proves the PR builds on macOS. CSC_IDENTITY_AUTO_DISCOVERY
      # stops electron-builder from scanning the runner keychain for an identity it
      # will not find. scripts/notarize.js already no-ops when APPLE_* is unset.
      # This artifact is never published -- build-app.yml has no upload step, and
      # release-app.yml (the only workflow that ships builds) runs on push/dispatch
      # from this repo, always has secrets, and still gates its upload on the full
      # codesign + spctl + stapler check.
      - name: build for mac (unsigned, no credentials)
        if: steps.signing.outputs.available != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:app:mac
      - name: verify app signature
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          APP_PATH=$(find dist/mac-arm64 -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "${APP_PATH:-}" ]; then
            echo "No .app found in dist/mac-arm64"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee /tmp/codesign.log
          grep -q "TeamIdentifier=${APPLE_TEAM_ID}" /tmp/codesign.log
          spctl --assess --type execute --verbose=4 "$APP_PATH"
      - name: validate app notarization
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          APP_PATH=$(find dist/mac-arm64 -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "${APP_PATH:-}" ]; then
            echo "No .app found in dist/mac-arm64"
            exit 1
          fi
          xcrun stapler validate "$APP_PATH"
      # Fork PRs produce an unsigned bundle, so the two checks above cannot run.
      # Assert the build still produced an .app and say why the rest was skipped,
      # rather than leaving a silently-green gap in the log.
      - name: report unsigned build
        if: steps.signing.outputs.available != 'true'
        run: |
          set -euo pipefail
          APP_PATH=$(find dist/mac-arm64 -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "${APP_PATH:-}" ]; then
            echo "No .app found in dist/mac-arm64"
            exit 1
          fi
          echo "Built unsigned: $APP_PATH"
          echo "Signature and notarization checks skipped - no credentials on this runner."
  build_on_linux:
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.build_on_linux
    runs-on: ubuntu-latest
    env:
      CI: false
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev libpixman-1-dev
      - name: install node-gyp
        run: npm i -g node-gyp@latest
      - name: clean npm cache
        run: npm cache clean -f
      - name: install dependencies
        run: npm ci
      - name: build for linux
        run: npm run build:app:linux
